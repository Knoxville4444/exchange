        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/versionen/{version}/bausteine:
    get:
      tags: [Versionsinhalte]
      operationId: getBausteinReferenzen
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Baustein-Referenzen einer Formularversion abrufen
      description: Liefert die Baustein-Referenzen inkl. der zum Stichtag aufgelösten Versionen. Nur für Typ `FORMULAR`.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/StatusStichtag"
      responses:
        "200":
          description: Baustein-Referenzen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AufgeloesteBausteinReferenz"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictTyp"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Versionsinhalte]
      operationId: updateBausteinReferenzen
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Baustein-Referenzen einer Formularversion setzen
      description: |
        Ersetzt die Baustein-Referenzen (z. B. Pinning auf eine exakte Version oder Wechsel der
        Hauptversion). Nur im Status `DRAFT` und für Typ `FORMULAR` möglich.

        Die Menge der Referenzen muss exakt den Baustein-Bereichen im ODT entsprechen; referenzierte
        Bausteine müssen existieren und vom Typ `BAUSTEIN` sein, sonst `400`.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BausteinReferenz"
            example:
              - baustein: PATGBM/Briefkopf
                version: "1"
              - baustein: ALLGEMEIN/Rechtsbehelfsbelehrung
                version: "2.0"
      responses:
        "200":
          description: Referenzen gesetzt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequestBausteine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version ist nicht im Status `DRAFT` oder kein Formular
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestErrorInfo"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/versionen/{version}/veroeffentlichung:
    put:
      tags: [Veroeffentlichung]
      operationId: setVersionVeroeffentlichung
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Version veröffentlichen, Veröffentlichung planen oder Version zurückziehen
      description: |
        Setzt bzw. ändert den Veröffentlichungszeitraum einer Version. Eine Version im Status `DRAFT`
        wechselt dabei auf `FREIGEGEBEN`.

        | Vorhaben | Body |
        |---|---|
        | sofort veröffentlichen | `{}` (ab = jetzt) |
        | geplant veröffentlichen | `{ "ab": "2027-01-01T00:00:00+01:00" }` |
        | geplant zurückziehen | `{ "ab": "…", "bis": "2027-06-30T00:00:00+02:00" }` |
        | sofort zurückziehen | `{ "ab": "…", "bis": "<jetzt>" }` |

        Zulässige Änderungen je effektivem Status:
        - `DRAFT`, `GEPLANT`: `ab` und `bis` frei änderbar
        - `VEROEFFENTLICHT`: `ab` unveränderlich, `bis` setz- und änderbar (nicht in der Vergangenheit)
        - `ZURUECKGEZOGEN`: keine Änderung möglich

        Zusätzliche Prüfungen (`409`):
        - **Formular**: alle referenzierten Bausteine müssen zum Zeitpunkt `ab` auflösbar sein.
        - **Baustein**: ein Rückzug wird abgelehnt, wenn ein veröffentlichtes oder geplantes Formular
          den Baustein danach nicht mehr auflösen könnte. Die betroffenen Formulare stehen in `detail`.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zeitraum"
            example:
              ab: "2027-01-01T00:00:00+01:00"
      responses:
        "200":
          description: Zeitraum gesetzt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Änderung im aktuellen effektiven Status nicht zulässig, referenzierter Baustein nicht
            auflösbar oder Baustein wird noch verwendet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestErrorInfo"
              example:
                errorId: BAUSTEIN_WIRD_VERWENDET
                errorMessage: Baustein PATGBM/Briefkopf 1.4 ist exakt referenziert und kann nicht zurückgezogen werden
                retryPossible: false
                detail:
                  verwendungen:
                    - formular: PATGBM/Anmeldebestaetigung
                      version: "2.3"
                      angabe: "1.4"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Veroeffentlichung]
      operationId: deleteVersionVeroeffentlichung
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Geplante Veröffentlichung absagen
      description: |
        Setzt eine Version im effektiven Status `GEPLANT` zurück auf `DRAFT`.
        In jedem anderen Status wird die Anfrage mit `409` abgelehnt. Ebenso, wenn ein geplantes
        Formular diese Bausteinversion benötigt.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Veröffentlichung abgesagt, Version wieder `DRAFT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version ist nicht im effektiven Status `GEPLANT` oder wird von einem geplanten Formular benötigt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestErrorInfo"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/versionen/{version}/vorschau:
    post:
      tags: [Erzeugung]
      operationId: vorschauVersion
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Vorschau einer Formularversion (auch DRAFT) als PDF
      description: |
        Erzeugt aus der angegebenen Formularversion unabhängig von ihrem Status ein PDF, optional mit
        Testdaten. Dient der Prüfung von Entwürfen vor der Veröffentlichung.

        Mit `bausteinEntwuerfe=true` werden Baustein-Referenzen auf die höchste existierende Version
        aufgelöst, auch wenn diese noch `DRAFT` oder `GEPLANT` ist. So lässt sich prüfen, wie sich eine
        geänderte Bausteinversion in den Formularen auswirkt (siehe Verwendungsnachweis).

        **Hinweis**: Der Return-Content-Type application/json ist lediglich eine Umgehungslösung
        aufgrund eines Problems in einem Generierungswerkzeug (openapi-generator) und inhaltlich
        lediglich für Fehlerantworten relevant.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/Version"
        - name: bausteinEntwuerfe
          in: query
          required: false
          description: Falls `true`, werden auch Bausteinversionen im Status `DRAFT` und `GEPLANT` berücksichtigt
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Stichtag"
      requestBody:
        $ref: "#/components/requestBodies/VariablenOptional"
      responses:
        "200":
          description: Vorschau als PDF
          headers:
            X-Formular-Bausteine:
              $ref: "#/components/headers/XFormularBausteine"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestDaten"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictTyp"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    Kategorie:
      name: kategorie
      in: path
      required: true
      description: Kategorie der Vorlage (entspricht dem Fachsystem)
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9_]{1,29}$"
      example: PATGBM
    VorlagenName:
      name: vorlagenName
      in: path
      required: true
      description: Name der Vorlage, eindeutig innerhalb der Kategorie
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,100}$"
      example: Anmeldebestaetigung
    Version:
      name: version
      in: path
      required: true
      description: Exakte Version im Format `<Hauptversion>.<Nebenversion>`
      schema:
        type: string
        pattern: "^[1-9][0-9]*\\.[0-9]+$"
      example: "2.3"
    VersionAngabe:
      name: version
      in: query
      required: false
      description: |
        Gewünschte Version:
        - leer: höchste veröffentlichte Version
        - `<Hauptversion>` (z. B. `2`): höchste veröffentlichte Nebenversion dieser Hauptversion (**empfohlen**)
        - `<Hauptversion>.<Nebenversion>` (z. B. `2.3`): exakt diese Version
      schema:
        type: string
        pattern: "^[1-9][0-9]*(\\.[0-9]+)?$"
      example: "2"
    Stichtag:
      name: stichtag
      in: query
      required: false
      description: |
        Zeitpunkt, zu dem Vorlage und Bausteine aufgelöst werden (Standard: jetzt).
        Zeitangabe inkl. Zeitzone, z. B. `2026-03-01T00:00:00+01:00`.
      schema:
        type: string
        format: date-time
    StatusStichtag:
      name: stichtag
      in: query
      required: false
      description: |
        Zeitpunkt, zu dem effektive Status, `aktuelleVersion` und Baustein-Auflösung berechnet werden
        (Standard: jetzt). Erlaubt die Prüfung geplanter Veröffentlichungen und Rückzüge.
      schema:
        type: string
        format: date-time

  headers:
    LocationVorlage:
      description: URL der Vorlage (`/api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}`)
      schema:
        type: string
        format: uri-reference
    LocationVersion:
      description: URL der Version (`…/vorlagen/{kategorie}/{vorlagenName}/versionen/{version}`)
      schema:
        type: string
        format: uri-reference
    ContentDisposition:
      description: Dateiname des Dokuments, z. B. `attachment; filename="Anmeldebestaetigung_2.3.pdf"`
      schema:
        type: string
    XFormularVersion:
      description: Tatsächlich verwendete Version der Vorlage, z. B. `2.3`
      schema:
        type: string
    XFormularBausteine:
      description: |
        Tatsächlich verwendete Bausteinversionen, kommagetrennt,
        z. B. `PATGBM/Briefkopf=1.4, ALLGEMEIN/Rechtsbehelfsbelehrung=2.0`
      schema:
        type: string

  requestBodies:
    VariablenOptional:
      required: false
      description: |
        Optionale Variablen zur Befüllung. Aktuell als XML; der Aufbau ist durch das Schema der
        jeweiligen Formularversion vorgegeben (`GET …/versionen/{version}/schema`).
        Ohne Body bleiben die Felder unbefüllt.
      content:
        application/xml:
          schema:
            type: string
          example: |
            <formular>
              <aktenzeichen>10 2026 123 456.7</aktenzeichen>
              <anmelder>Erika Mustermann</anmelder>
              <eingangsdatum>2026-10-29</eingangsdatum>
            </formular>
    InhaltUpload:
      required: true
      description: Inhalt der Version (ODT für Formulare und Bausteine, PDF für Merkblätter)
      content:
        multipart/form-data:
          schema:
            type: object
            required: [inhalt]
            properties:
              inhalt:
                type: string
                format: binary
          encoding:
            inhalt:
              contentType: application/vnd.oasis.opendocument.text, application/pdf

  responses:
    Inhalt:
      description: Inhalt der Version (ODT oder PDF, abhängig vom Vorlagentyp)
      headers:
        Content-Disposition:
          $ref: "#/components/headers/ContentDisposition"
        X-Formular-Version:
          $ref: "#/components/headers/XFormularVersion"
      content:
        application/vnd.oasis.opendocument.text:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            type: string
            format: binary
    BadRequest:
      description: Anfrage syntaktisch oder fachlich fehlerhaft
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    BadRequestDaten:
      description: |
        Anfrage fehlerhaft, insbesondere Variablen nicht wohlgeformt oder nicht schemakonform.
        Die betroffenen Felder werden in `detail` geliefert.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
          example:
            errorId: VARIABLEN_UNGUELTIG
            errorMessage: Variablen entsprechen nicht dem Schema der Version 2.3
            retryPossible: false
            detail:
              fehler:
                - pfad: /formular/eingangsdatum
                  meldung: "'29.10.2026' ist kein gültiger Wert für xs:date"
    BadRequestBausteine:
      description: |
        Anfrage fehlerhaft, z. B. Pflichtteil fehlt, Inhalt passt nicht zum Typ oder
        Baustein-Bereiche und -Referenzen stimmen nicht überein bzw. referenzieren unbekannte Bausteine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
          example:
            errorId: BAUSTEIN_UNBEKANNT
            errorMessage: Bereich 'baustein:PATGBM/Fusszeile' verweist auf keinen existierenden Baustein
            retryPossible: false
    Unauthorized:
      description: Nicht autorisiert, z. B. fehlende Informationen aus Authentifizierung
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    Forbidden:
      description: Fehlende Berechtigungen für die betreffende Ressource (erforderliches Recht nicht vorhanden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    NotFound:
      description: Kategorie, Vorlage oder Version nicht gefunden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    KeineVersion:
      description: |
        Vorlage nicht gefunden oder zum Stichtag keine passende veröffentlichte Version vorhanden
        (z. B. Vorlage zurückgezogen, angefragte Hauptversion nicht veröffentlicht, Baustein nicht auflösbar).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    ConflictTyp:
      description: Operation für den Typ dieser Vorlage nicht möglich (z. B. Erzeugung aus einem Baustein)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    ConflictNichtDraft:
      description: Version ist nicht im Status `DRAFT`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    ConflictBausteinVerwendet:
      description: Baustein wird von einem veröffentlichten oder geplanten Formular benötigt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    PayloadTooLarge:
      description: Anfrage überschreitet die konfigurierte maximale Größe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    UnsupportedMediaType:
      description: Content-Type bzw. Dateiformat nicht unterstützt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    InternalServerError:
      description: Interner technischer Fehler aufgetreten
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"
    ServiceUnavailable:
      description: |
        Keine freie LibreOffice-Instanz verfügbar (Kapazität erschöpft).
        `retryPossible` ist `true`; der Aufruf kann nach kurzer Wartezeit wiederholt werden.
      headers:
        Retry-After:
          description: Empfohlene Wartezeit in Sekunden
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestErrorInfo"

  schemas:
    VorlagenTyp:
      type: string
      description: |
        - `FORMULAR`: ODT mit Variablen und Bausteinen, Erzeugung als ODT oder PDF/A
        - `BAUSTEIN`: ODT-Fragment, wird in Formulare eingebunden
        - `MERKBLATT`: PDF, wird 1:1 ausgeliefert
      enum: [FORMULAR, BAUSTEIN, MERKBLATT]

    VersionStatus:
      type: string
      description: |
        Gespeicherter Status einer Version:
        - `DRAFT`: Entwurf, änderbar und löschbar
        - `FREIGEGEBEN`: unveränderlich; Sichtbarkeit wird über den Zeitraum gesteuert
      enum: [DRAFT, FREIGEGEBEN]

    EffektiverVersionStatus:
      type: string
      description: |
        Aus Status und Zeitraum zum Stichtag (Standard: jetzt) abgeleiteter Status:
        - `DRAFT`: Entwurf
        - `GEPLANT`: freigegeben, Veröffentlichung liegt in der Zukunft
        - `VEROEFFENTLICHT`: nutzbar
        - `ZURUECKGEZOGEN`: nicht mehr nutzbar
      enum: [DRAFT, GEPLANT, VEROEFFENTLICHT, ZURUECKGEZOGEN]

    EffektiverVorlagenStatus:
      type: string
      description: |
        Aus Vorlagen-Zeitraum und Versionen zum Stichtag abgeleiteter Status der gesamten Vorlage:
        - `ENTWURF`: es gibt nur Versionen im Status `DRAFT`
        - `GEPLANT`: zum Stichtag keine Version nutzbar, aber eine Veröffentlichung ist geplant
        - `VEROEFFENTLICHT`: zum Stichtag ist mindestens eine Version nutzbar (`aktuelleVersion` gesetzt)
        - `ZURUECKGEZOGEN`: Vorlagen-Zeitraum beendet oder alle freigegebenen Versionen zurückgezogen
      enum: [ENTWURF, GEPLANT, VEROEFFENTLICHT, ZURUECKGEZOGEN]

    VersionArt:
      type: string
      description: |
        - `HAUPT`: neue Hauptversion, nicht abwärtskompatibel
        - `NEBEN`: neue Nebenversion, abwärtskompatibel
      enum: [HAUPT, NEBEN]

    Zeitraum:
      type: object
      description: |
        Veröffentlichungszeitraum. `ab` inklusiv, `bis` exklusiv. Zeitangaben inkl. Zeitzone.
        Fehlt `ab`, gilt der aktuelle Zeitpunkt; fehlt `bis`, ist der Zeitraum unbefristet.
      properties:
        ab:
          type: string
          format: date-time
          description: Beginn der Veröffentlichung (inklusiv)
        bis:
          type: string
          format: date-time
          description: Ende der Veröffentlichung bzw. Zeitpunkt des Rückzugs (exklusiv)

    Audit:
      type: object
      required: [erstelltAm, erstelltVon]
      properties:
        erstelltAm:
          type: string
          format: date-time
        erstelltVon:
          type: string
          maxLength: 255
          description: Benutzerkennung aus dem Token
        geaendertAm:
          type: string
          format: date-time
        geaendertVon:
          type: string
          maxLength: 255

    KategorieRequest:
      type: object
      properties:
        beschreibung:
          type: string
          maxLength: 2000

    KategorieResponse:
      type: object
      required: [kategorie, anzahlVorlagen]
      properties:
        kategorie:
          type: string
          example: PATGBM
        beschreibung:
          type: string
        anzahlVorlagen:
          type: integer
          format: int32
          minimum: 0

    Tags:
      type: array
      description: Freie Schlagworte zur Suche und Filterung
      maxItems: 50
      uniqueItems: true
      items:
        type: string
        maxLength: 100

    BausteinName:
      type: string
      description: Vollqualifizierter Name eines Bausteins `<KATEGORIE>/<Name>`
      pattern: "^[A-Z][A-Z0-9_]{1,29}/[A-Za-z0-9_-]{1,100}$"
      example: PATGBM/Briefkopf

    BausteinReferenz:
      type: object
      description: Referenz einer Formularversion auf einen Baustein
      required: [baustein, version]
      properties:
        baustein:
          $ref: "#/components/schemas/BausteinName"
        version:
          type: string
          pattern: "^[1-9][0-9]*(\\.[0-9]+)?$"
          description: "Hauptversion (z. B. `1`, neueste Nebenversion) oder exakte Version (z. B. `1.4`, gepinnt)"
          example: "1"

    AufgeloesteBausteinReferenz:
      type: object
      required: [baustein, angabe]
      properties:
        baustein:
          $ref: "#/components/schemas/BausteinName"
        angabe:
          type: string
          description: Versionsangabe der Referenz (`1` oder `1.4`)
          example: "1"
        aufgeloesteVersion:
          type: string
          description: Zum Stichtag aufgelöste Bausteinversion; fehlt, wenn nicht auflösbar
          example: "1.4"

    VorlageCreateRequest:
      type: object
      description: Stammdaten und Inhalt der ersten Version (`1.0`) einer neuen Vorlage
      required: [vorlagenName, typ, bezeichnung, inhalt]
      properties:
        vorlagenName:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,100}$"
          description: Technischer Name, eindeutig innerhalb der Kategorie, nicht änderbar
        typ:
          $ref: "#/components/schemas/VorlagenTyp"
        bezeichnung:
          type: string
          maxLength: 255
          description: Fachliche Bezeichnung
        beschreibung:
          type: string
          maxLength: 2000
        tags:
          type: array
          description: |
            Freie Schlagworte zur Suche und Filterung (mehrfach angebbar). Bewusst ohne `uniqueItems`:
            für Multipart-Felder erzeugt der openapi-generator sonst ein `Set` ohne Import.
          maxItems: 50
          items:
            type: string
            maxLength: 100
        kommentar:
          type: string
          maxLength: 2000
          description: Änderungsbeschreibung der Version `1.0`
        inhalt:
          type: string
          format: binary
          description: ODT (Formular, Baustein) bzw. PDF (Merkblatt)
        schema:
          type: string
          format: binary
          description: XML-Schema (XSD); Pflicht bei Typ `FORMULAR`, sonst nicht zulässig

    VorlageUpdateRequest:
      type: object
      required: [bezeichnung]
      properties:
        bezeichnung:
          type: string
          maxLength: 255
        beschreibung:
          type: string
          maxLength: 2000
        tags:
          $ref: "#/components/schemas/Tags"

    VorlageResponse:
      type: object
      description: Stammdaten einer Vorlage
      required: [kategorie, vorlagenName, typ, bezeichnung, tags, stichtag, effektiverStatus, audit, versionen]
      properties:
        kategorie:
          type: string
        vorlagenName:
          type: string
        typ:
          $ref: "#/components/schemas/VorlagenTyp"
        bezeichnung:
          type: string
        beschreibung:
          type: string
        tags:
          $ref: "#/components/schemas/Tags"
        veroeffentlichung:
          $ref: "#/components/schemas/Zeitraum"
        stichtag:
          type: string
          format: date-time
          description: Zeitpunkt, zu dem `effektiverStatus`, `aktuelleVersion` und die Versionsstatus berechnet wurden
        effektiverStatus:
          $ref: "#/components/schemas/EffektiverVorlagenStatus"
        aktuelleVersion:
          type: string
          description: |
            Version, die zum Stichtag ohne Versionsangabe aufgelöst würde.
            Fehlt, wenn zum Stichtag keine Version nutzbar ist.
          example: "2.3"
        audit:
          $ref: "#/components/schemas/Audit"
        versionen:
          type: array
          description: Übersicht aller Versionen, absteigend sortiert
          items:
            $ref: "#/components/schemas/VersionKurz"

    VersionKurz:
      type: object
      required: [version, effektiverStatus]
      properties:
        version:
          type: string
          example: "2.3"
        effektiverStatus:
          $ref: "#/components/schemas/EffektiverVersionStatus"

    VersionCreateRequest:
      type: object
      required: [art]
      properties:
        art:
          $ref: "#/components/schemas/VersionArt"
        basisHauptversion:
          type: integer
          format: int32
          minimum: 1
          description: "Nur bei `art=NEBEN`: Hauptversion, deren Nebenversion hochgezählt wird (Standard: höchste)"
        basisVersion:
          type: string
          pattern: "^[1-9][0-9]*\\.[0-9]+$"
          description: |
            Version, aus der Inhalt, Schema und Baustein-Referenzen übernommen werden
            (Standard: höchste Version der betroffenen Hauptversion bzw. höchste Version bei `HAUPT`)
        kommentar:
          type: string
          maxLength: 2000
          description: Änderungsbeschreibung
        inhalt:
          type: string
          format: binary
          description: Optional; ersetzt den übernommenen Inhalt (ODT bzw. PDF)
        schema:
          type: string
          format: binary
          description: Optional und nur bei `art=HAUPT` vom Typ `FORMULAR`; ersetzt das übernommene Schema

    VersionResponse:
      type: object
      description: Eine Version einer Vorlage
      required: [kategorie, vorlagenName, typ, version, hauptversion, nebenversion, status, effektiverStatus, audit]
      properties:
        kategorie:
          type: string
        vorlagenName:
          type: string
        typ:
          $ref: "#/components/schemas/VorlagenTyp"
        version:
          type: string
          example: "2.3"
        hauptversion:
          type: integer
          format: int32
          example: 2
        nebenversion:
          type: integer
          format: int32
          example: 3
        status:
          $ref: "#/components/schemas/VersionStatus"
        effektiverStatus:
          $ref: "#/components/schemas/EffektiverVersionStatus"
        veroeffentlichung:
          $ref: "#/components/schemas/Zeitraum"
        kommentar:
          type: string
        bausteine:
          type: array
          description: Baustein-Referenzen inkl. Auflösung zum Stichtag (nur bei Typ `FORMULAR`)
          items:
            $ref: "#/components/schemas/AufgeloesteBausteinReferenz"
        inhaltPruefsumme:
          type: string
          description: SHA-256 des Inhalts (Nachvollziehbarkeit)
        audit:
          $ref: "#/components/schemas/Audit"

    AufloesungResponse:
      type: object
      description: Ergebnis der Versionsauflösung
      required: [stichtag, kategorie, vorlagenName, version]
      properties:
        stichtag:
          type: string
          format: date-time
        kategorie:
          type: string
        vorlagenName:
          type: string
        version:
          type: string
          description: Aufgelöste Version der Vorlage
          example: "2.3"
        bausteine:
          type: array
          description: Aufgelöste Bausteine (nur bei Typ `FORMULAR`)
          items:
            $ref: "#/components/schemas/AufgeloesteBausteinReferenz"

    VerwendungResponse:
      type: object
      description: Verwendung eines Bausteins in einer Formularversion
      required: [formular, version, effektiverStatus, angabe]
      properties:
        formular:
          type: string
          description: Vollqualifizierter Name des Formulars `<KATEGORIE>/<Name>`
          example: PATGBM/Anmeldebestaetigung
        version:
          type: string
          description: Version des Formulars
          example: "2.3"
        effektiverStatus:
          $ref: "#/components/schemas/EffektiverVersionStatus"
        angabe:
          type: string
          description: Versionsangabe der Referenz (`1` oder `1.4`)
          example: "1"
        aufgeloesteVersion:
          type: string
          description: Zum Stichtag aufgelöste Bausteinversion; fehlt, wenn nicht auflösbar
          example: "1.4"

    RestErrorInfo:
      type: object
      description: Ein RestErrorInfo-Objekt bündelt Detailinformationen zu einem server-seitig aufgetretenen Fehler.
      required: [errorId, errorMessage, retryPossible]
      properties:
        errorId:
          type: string
          description: Identifier, welcher den aufgetretenen Fehler eindeutig kennzeichnet
        errorMessage:
          type: string
          description: Beschreibung des aufgetretenen Fehlers
        stackTrace:
          type: string
          description: Stacktrace der zugrundeliegenden Exception
        versionInfo:
          type: string
          description: Versionsangabe des Dienstes, der die Fehlerinformation liefert
        retryPossible:
          type: boolean
          description: Kennzeichen, ob eine Wiederholung des Aufrufs als erfolgversprechend erachtet wird
        detail:
          type: object
          description: Schnittstellen-spezifische Detailinformationen zum aufgetretenen Fehler

  securitySchemes:
    oidc:
      type: openIdConnect
      description: OIDC Resource Server (JWT). Die Rollen des Dienstes werden über `permissions` auf Gruppen aus dem Token gemappt.
      openIdConnectUrl: https://keycloak.example/auth/realms/REALM/.well-known/openid-configuration
