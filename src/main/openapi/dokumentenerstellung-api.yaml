openapi: 3.0.3
info:
  title: Formular-Service (Dokumentenerstellung)
  version: 0.4.0-SNAPSHOT
  description: |
    API zur Erzeugung von Dokumenten aus Vorlagen (Formulare, Formularbausteine, Merkblätter)
    über LibreOffice sowie zur revisionssicheren Verwaltung der Vorlagen und ihrer Versionen.

    # Übersicht

    | Tag | Pfad (unter `/api/dokumentenerstellung/v1`) | Rolle | Zweck |
    |---|---|---|---|
    | **Erzeugung** | `/vorlagen/{kategorie}/{vorlagenName}/erzeugung/…`, `/konvertierung/pdfa`, `…/versionen/{version}/vorschau` | `formular_nutzer` (Vorschau: `formular_verwaltung`) | Formular [+ Variablen] → ODT bzw. PDF/A, ODT → PDF/A, Vorschau |
    | **Abruf** | `…/merkblatt`, `…/aufloesung` | `formular_nutzer` | Merkblatt 1:1, Versionsauflösung |
    | **Kategorien** | `/kategorien/…` | `formular_verwaltung` | Kategorien (≙ Fachsysteme) |
    | **Vorlagen** | `/vorlagen/…` | `formular_verwaltung` | Suche, Anlage, Stammdaten, aufgelöster Inhalt, Verwendungsnachweis |
    | **Versionen** | `…/versionen`, `…/versionen/{version}` | `formular_verwaltung` | Versionen anlegen, abrufen, löschen |
    | **Versionsinhalte** | `…/versionen/{version}/inhalt`, `…/schema`, `…/bausteine` | `formular_verwaltung` | Inhalt, Schema, Baustein-Referenzen |
    | **Veroeffentlichung** | `…/veroeffentlichung` (Vorlage und Version) | `formular_verwaltung` | Planen, verschieben, absagen, zurückziehen |

    Je Tag erzeugt der openapi-generator ein Interface (`ErzeugungApi`, `VorlagenApi` …), das eine Resource implementiert.

    # Anwendungsfälle

    | Anwendungsfall | Eingabe | Ausgabe | Endpunkt |
    |---|---|---|---|
    | Merkblatt | Merkblatt (PDF) | PDF | `GET …/merkblatt` |
    | Ohne manuelle Bearbeitung | Formular + Variablen | PDF/A | `POST …/erzeugung/pdfa` |
    | Mit manueller Bearbeitung, Schritt 1 | Formular [+ Variablen] | ODT | `POST …/erzeugung/odt` |
    | Mit manueller Bearbeitung, Schritt 2 | ODT [+ Variablen] | PDF/A | `POST /api/dokumentenerstellung/v1/konvertierung/pdfa` |

    # Berechtigungen

    Der Dienst ist ein OIDC Resource Server (JWT). Die Rollen des Dienstes werden in der Konfiguration unter
    `permissions` auf Gruppen bzw. Rollen aus dem Token gemappt. Die je Endpunkt erforderliche Rolle steht in
    der Extension `x-rollen`.

    | Rolle | Endpunkte |
    |---|---|
    | `formular_nutzer` | Erzeugung, Konvertierung, Merkblatt, Versionsauflösung |
    | `formular_verwaltung` | alle Endpunkte der Verwaltung inkl. Vorschau |

    Fehlt die erforderliche Rolle, antwortet der Service mit `403`.

    > **Offen:** Mandantenfähigkeit (Instanzen A1/A2 eines Fachsystems mit unterschiedlichen Versionen)
    > und Einschränkung auf Kategorien über Rechte. Hinweis: Geben die Instanzen ihre Hauptversion
    > selbst an (`version=1` bzw. `version=2`), ist die Anforderung bereits ohne Mandantenlogik erfüllt.

    # Ablage

    Jede Vorlage gehört genau einer **Kategorie** (entspricht dem Fachsystem) und wird über
    `kategorie` + `vorlagenName` eindeutig identifiziert. Gleichnamige Vorlagen in verschiedenen
    Kategorien sind voneinander unabhängig. Vorlagen können zusätzlich mit **Tags** versehen werden.

    ```
    PATGBM/
      Anmeldebestaetigung      (FORMULAR)
      Briefkopf                (BAUSTEIN)
      Gebuehrenhinweise        (MERKBLATT)
    DESIGN/
      Anmeldebestaetigung      (FORMULAR, unabhängig von PATGBM/Anmeldebestaetigung)
    ```

    > **Offen:** Fachsystem-übergreifende Nutzung von Bausteinen (gemeinsame Kategorie wie `ALLGEMEIN`
    > oder direkte Referenz in fremde Kategorien). Die Referenzsyntax `KATEGORIE/Name` lässt beides zu.

    # Vorlagentypen

    | Typ | Inhalt | Schema | Bausteine | Verwendung |
    |---|---|---|---|---|
    | `FORMULAR` | ODT | XSD (Pflicht) | ja | Erzeugung ODT / PDF/A |
    | `BAUSTEIN` | ODT | – | – | wird in Formulare eingebunden |
    | `MERKBLATT` | PDF | – | – | 1:1-Auslieferung |

    Der Typ wird beim Anlegen festgelegt und ist nicht änderbar.

    # Versionierung

    Versionen haben die Form `<Hauptversion>.<Nebenversion>` (z. B. `2.3`) und werden vom Service vergeben.

    | Art | Bedeutung | Beispiel |
    |---|---|---|
    | **Hauptversion** | nicht abwärtskompatibel, z. B. neue Variablen | `1.4` → `2.0` |
    | **Nebenversion** | abwärtskompatibel, z. B. Layout, Textänderung, geänderte Baustein-Referenz | `2.0` → `2.1` |

    Eine Version eines Formulars besteht aus **ODT-Inhalt + XSD + Baustein-Referenzen**.
    Eine neue Version kann als Kopie einer bestehenden Version angelegt werden; Inhalt, Schema und
    Baustein-Referenzen werden dabei übernommen und können im Status `DRAFT` geändert werden.

    # Bausteine

    Ein Formular-ODT enthält für jeden Baustein einen LibreOffice-**Bereich** mit dem Namen
    `baustein:<KATEGORIE>/<Name>`, z. B. `baustein:PATGBM/Briefkopf`. Die zu verwendende
    **Version** steht nicht im ODT, sondern in den Baustein-Referenzen der Formularversion:

    | Angabe | Wirkung |
    |---|---|
    | `"1"` | neueste zum Stichtag veröffentlichte Version mit Hauptversion 1 (**Standard**) |
    | `"1.4"` | exakt Version 1.4 (gepinnt) |

    Beim Hochladen eines Formular-ODT erkennt der Service die Bereiche und legt für neue Bausteine
    automatisch eine Referenz auf die höchste existierende Hauptversion an. Die Referenzen können
    über `PUT …/versionen/{version}/bausteine` angepasst werden, ohne das ODT zu ändern.

    Regeln:
    - Jeder Baustein-Bereich im ODT benötigt genau eine Referenz und umgekehrt.
    - Bausteine enthalten keine weiteren Bausteine.
    - Variablen in Bausteinen müssen im Schema (XSD) des Formulars enthalten sein.
    - Bausteine verwenden nur Formatvorlagen, die im Formular vorhanden sind.
    - Der Verwendungsnachweis (`GET …/verwendungen`) zeigt, welche Formularversionen einen Baustein referenzieren.

    # Statusmodell

    Gespeichert wird pro Version nur `DRAFT` oder `FREIGEGEBEN` sowie ein Veröffentlichungszeitraum.
    Der **effektive Status** wird zum jeweiligen Zeitpunkt daraus abgeleitet. Es gibt keinen Scheduler,
    der Status umschaltet; geplante Veröffentlichungen und Rückzüge greifen exakt zum hinterlegten Zeitpunkt.
    Das Modell gilt für alle Vorlagentypen.

    ```
    DRAFT ──PUT …/veroeffentlichung (ab, bis?)──▶ FREIGEGEBEN

    effektiver Status zum Zeitpunkt t:
      DRAFT                      → DRAFT
      FREIGEGEBEN, t <  ab       → GEPLANT
      FREIGEGEBEN, ab ≤ t < bis  → VEROEFFENTLICHT
      FREIGEGEBEN, t ≥ bis       → ZURUECKGEZOGEN
    ```

    Regeln:
    - Nur im Status `DRAFT` sind Inhalt, Schema und Baustein-Referenzen änderbar und ist die Version löschbar.
      Danach ist eine Version unveränderlich.
    - Solange eine Version `GEPLANT` ist, kann der Zeitraum beliebig geändert oder die
      Veröffentlichung per `DELETE …/veroeffentlichung` abgesagt werden (zurück auf `DRAFT`).
    - Ist eine Version `VEROEFFENTLICHT`, kann nur noch `bis` gesetzt bzw. geändert werden (Rückzug).
    - Eine Formularversion kann nur veröffentlicht werden, wenn alle referenzierten Bausteine zum
      Zeitpunkt `ab` in der angegebenen (Haupt-)Version veröffentlicht sind.
    - Eine Bausteinversion kann nicht zurückgezogen werden, wenn ein veröffentlichtes oder geplantes
      Formular den Baustein danach nicht mehr auflösen könnte (z. B. exakt gepinnt).
    - Zusätzlich kann für die **gesamte Vorlage** ein Zeitraum hinterlegt werden
      (`…/vorlagen/{kategorie}/{vorlagenName}/veroeffentlichung`). Außerhalb dieses Zeitraums ist keine
      Version nutzbar, unabhängig vom Status der einzelnen Versionen.
    - Alle lesenden Verwaltungs-Endpunkte akzeptieren `stichtag`; effektive Status und
      `aktuelleVersion` werden dann zu diesem Zeitpunkt berechnet.

    # Versionsauflösung

    Der Parameter `version` ist optional und kann in drei Formen angegeben werden:

    | Angabe | Verwendete Version |
    |---|---|
    | *(keine)* | höchste zum Stichtag veröffentlichte Version |
    | `2` | höchste zum Stichtag veröffentlichte Version mit Hauptversion 2 (**empfohlen**) |
    | `2.3` | exakt diese Version; sie muss zum Stichtag veröffentlicht sein |

    Wird eine Version zurückgezogen, fällt die Auflösung automatisch auf die nächstniedrigere
    veröffentlichte Version zurück (z. B. `2` → `2.3`, wenn `2.4` zurückgezogen wurde).
    Baustein-Referenzen werden nach denselben Regeln zum **selben Stichtag** aufgelöst.
    Damit ist jedes erzeugte Dokument über Formularversion und Zeitpunkt exakt rekonstruierbar.

    Der Stichtag ist standardmäßig der aktuelle Zeitpunkt und kann über `stichtag` gesetzt werden.
    Die verwendeten Versionen werden in den Headern `X-Formular-Version` und `X-Formular-Bausteine` geliefert.

    # Erzeugung

    Ablauf bei `…/erzeugung/odt` und `…/erzeugung/pdfa`:
    1. Formularversion zum Stichtag auflösen.
    2. Baustein-Referenzen zum selben Stichtag auflösen und die Bereiche mit dem Bausteininhalt füllen.
    3. Variablen befüllen (sofern Daten übergeben wurden).
    4. Ergebnis als ODT bzw. PDF/A liefern.

    Die Variablen werden im Request-Body übergeben, aktuell als XML (`application/xml`), und gegen das
    Schema der Formularversion validiert; bei Fehlern antwortet der Service mit `400` und liefert die
    betroffenen Felder in `detail`. Die Daten sind **optional**: Ohne Daten bleiben die Felder unbefüllt,
    z. B. für die anschließende manuelle Bearbeitung.

    # Ausblick (nicht Bestandteil dieser Version)

    - Asynchrone Erzeugung großer Dokumente sowie Ablage von Entwürfen und Zwischenständen im Service
      (Ausbaustufe 3) – vorgesehen als eigene Ressource `…/dokumente` mit Auftragsmodell.
    - Import bestehender Formulare aus PatGbm und DIZ (Ausbaustufe 2).
servers:
  - url: ""
    description: Symbolhafte Beispiel-URL.
security:
  - oidc: []
tags:
  - name: Erzeugung
    description: Dokumente aus Formularen erzeugen, ODT nach PDF/A konvertieren, Vorschau (LibreOffice)
  - name: Abruf
    description: Merkblätter abrufen und Versionsauflösung ermitteln
  - name: Kategorien
    description: Kategorien (≙ Fachsysteme) verwalten
  - name: Vorlagen
    description: Vorlagen anlegen, suchen, ändern, löschen; aufgelöster Inhalt und Verwendungsnachweis
  - name: Versionen
    description: Versionen anlegen, abrufen und löschen
  - name: Versionsinhalte
    description: Inhalt, Schema und Baustein-Referenzen einer Version
  - name: Veroeffentlichung
    description: Veröffentlichung planen, verschieben, absagen und zurückziehen – je Version oder für die ganze Vorlage

paths:
  # ───────────────────────────── Erzeugung ─────────────────────────────
  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/erzeugung/odt:
    post:
      tags: [Erzeugung]
      operationId: erzeugeOdt
      security:
        - oidc: []
      x-rollen: [formular_nutzer]
      summary: Formular [+ Variablen] als ODT erzeugen
      description: |
        Erzeugt aus einem Formular (Typ `FORMULAR`) ein ODT-Dokument zur manuellen Bearbeitung.
        Bausteine werden eingefügt; Variablen werden befüllt, sofern Daten übergeben werden.

        **Hinweis**: Der Return-Content-Type application/json ist lediglich eine Umgehungslösung
        aufgrund eines Problems in einem Generierungswerkzeug (openapi-generator) und inhaltlich
        lediglich für Fehlerantworten relevant.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/VersionAngabe"
        - $ref: "#/components/parameters/Stichtag"
      requestBody:
        $ref: "#/components/requestBodies/VariablenOptional"
      responses:
        "200":
          description: Erzeugtes ODT
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Formular-Version:
              $ref: "#/components/headers/XFormularVersion"
            X-Formular-Bausteine:
              $ref: "#/components/headers/XFormularBausteine"
          content:
            application/vnd.oasis.opendocument.text:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestDaten"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/KeineVersion"
        "409":
          $ref: "#/components/responses/ConflictTyp"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/erzeugung/pdfa:
    post:
      tags: [Erzeugung]
      operationId: erzeugePdfa
      security:
        - oidc: []
      x-rollen: [formular_nutzer]
      summary: Formular + Variablen als PDF/A erzeugen
      description: |
        Erzeugt aus einem Formular (Typ `FORMULAR`) ein abgeschlossenes PDF/A-Dokument.
        Bausteine werden eingefügt; Variablen werden befüllt, sofern Daten übergeben werden.

        **Hinweis**: Der Return-Content-Type application/json ist lediglich eine Umgehungslösung
        aufgrund eines Problems in einem Generierungswerkzeug (openapi-generator) und inhaltlich
        lediglich für Fehlerantworten relevant.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/VersionAngabe"
        - $ref: "#/components/parameters/Stichtag"
      requestBody:
        $ref: "#/components/requestBodies/VariablenOptional"
      responses:
        "200":
          description: Erzeugtes PDF/A
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Formular-Version:
              $ref: "#/components/headers/XFormularVersion"
            X-Formular-Bausteine:
              $ref: "#/components/headers/XFormularBausteine"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestDaten"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/KeineVersion"
        "409":
          $ref: "#/components/responses/ConflictTyp"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/dokumentenerstellung/v1/konvertierung/pdfa:
    post:
      tags: [Erzeugung]
      operationId: konvertiereOdtNachPdfa
      security:
        - oidc: []
      x-rollen: [formular_nutzer]
      summary: ODT [+ Variablen] in PDF/A konvertieren
      description: |
        Konvertiert ein (typischerweise zuvor über `…/erzeugung/odt` erzeugtes und manuell bearbeitetes)
        ODT-Dokument in PDF/A. Optional können Variablen übergeben werden, um noch unbefüllte Felder zu
        befüllen. Eine Schemavalidierung findet nicht statt, da das Dokument keiner Formularversion
        zugeordnet ist.

        **Hinweis**: Der Return-Content-Type application/json ist lediglich eine Umgehungslösung
        aufgrund eines Problems in einem Generierungswerkzeug (openapi-generator) und inhaltlich
        lediglich für Fehlerantworten relevant.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dokument]
              properties:
                dokument:
                  type: string
                  format: binary
                  description: ODT-Dokument
                variablen:
                  type: string
                  format: binary
                  description: Optionale Variablen (XML) zur Befüllung noch offener Felder
            encoding:
              dokument:
                contentType: application/vnd.oasis.opendocument.text
              variablen:
                contentType: application/xml
      responses:
        "200":
          description: PDF/A
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/merkblatt:
    get:
      tags: [Abruf]
      operationId: getMerkblatt
      security:
        - oidc: []
      x-rollen: [formular_nutzer]
      summary: Merkblatt abrufen
      description: |
        Liefert ein Merkblatt (Typ `MERKBLATT`) in der aufgelösten Version unverändert (1:1) als PDF.

        **Hinweis**: Der Return-Content-Type application/json ist lediglich eine Umgehungslösung
        aufgrund eines Problems in einem Generierungswerkzeug (openapi-generator) und inhaltlich
        lediglich für Fehlerantworten relevant.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/VersionAngabe"
        - $ref: "#/components/parameters/Stichtag"
      responses:
        "200":
          description: Merkblatt als PDF
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Formular-Version:
              $ref: "#/components/headers/XFormularVersion"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/KeineVersion"
        "409":
          $ref: "#/components/responses/ConflictTyp"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/aufloesung:
    get:
      tags: [Abruf]
      operationId: loeseVersionAuf
      security:
        - oidc: []
      x-rollen: [formular_nutzer]
      summary: Versionsauflösung ermitteln
      description: |
        Liefert die Version der Vorlage und (bei Formularen) die Versionen der Bausteine, die mit
        denselben Parametern verwendet würden, ohne ein Dokument zu erzeugen.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/VersionAngabe"
        - $ref: "#/components/parameters/Stichtag"
      responses:
        "200":
          description: Aufgelöste Versionen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AufloesungResponse"
              example:
                stichtag: "2026-10-30T10:00:00+01:00"
                kategorie: PATGBM
                vorlagenName: Anmeldebestaetigung
                version: "2.3"
                bausteine:
                  - baustein: PATGBM/Briefkopf
                    angabe: "1"
                    aufgeloesteVersion: "1.4"
                  - baustein: ALLGEMEIN/Rechtsbehelfsbelehrung
                    angabe: "2.0"
                    aufgeloesteVersion: "2.0"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/KeineVersion"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ─────────────────────────── Verwaltung: Kategorien ───────────────────────────
  /api/dokumentenerstellung/v1/kategorien:
    get:
      tags: [Kategorien]
      operationId: listKategorien
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Kategorien auflisten
      responses:
        "200":
          description: Liste der Kategorien
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KategorieResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/kategorien/{kategorie}:
    put:
      tags: [Kategorien]
      operationId: putKategorie
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Kategorie anlegen oder ändern
      description: Legt eine Kategorie an bzw. ändert deren Beschreibung (idempotent).
      parameters:
        - $ref: "#/components/parameters/Kategorie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KategorieRequest"
            example:
              beschreibung: Patente und Gebrauchsmuster
      responses:
        "200":
          description: Kategorie angelegt bzw. geändert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KategorieResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Kategorien]
      operationId: deleteKategorie
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Kategorie löschen
      description: Löscht eine Kategorie. Nur möglich, wenn sie keine Vorlagen enthält.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
      responses:
        "204":
          description: Kategorie gelöscht
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
