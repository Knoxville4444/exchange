        "200":
          description: Vorlage geändert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VorlageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Vorlagen]
      operationId: deleteVorlage
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Vorlage löschen
      description: |
        Löscht eine Vorlage inkl. aller Versionen. Nur möglich, wenn **alle** Versionen im Status
        `DRAFT` sind und (bei Bausteinen) keine Formularversion den Baustein referenziert.
