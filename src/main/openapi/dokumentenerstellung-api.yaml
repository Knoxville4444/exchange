  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/veroeffentlichung:
    put:
      tags: [Veroeffentlichung]
      operationId: setVorlageVeroeffentlichung
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Veröffentlichungszeitraum der gesamten Vorlage setzen
      description: |
        Setzt bzw. ändert den Zeitraum, in dem die Vorlage als Ganzes nutzbar ist. Ist kein Zeitraum
        gesetzt, ist die Vorlage unbeschränkt nutzbar (maßgeblich sind dann nur die Versionen).

        Beispiel „Formular entfällt zum Jahresende“: `{ "bis": "2027-01-01T00:00:00+01:00" }`

        Für Bausteine gilt: Ein Rückzug wird mit `409` abgelehnt, wenn ein veröffentlichtes oder
        geplantes Formular den Baustein danach nicht mehr auflösen könnte.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zeitraum"
      responses:
        "200":
          description: Zeitraum gesetzt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VorlageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictBausteinVerwendet"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Veroeffentlichung]
      operationId: deleteVorlageVeroeffentlichung
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Veröffentlichungszeitraum der gesamten Vorlage entfernen
      description: Entfernt den Zeitraum; die Vorlage ist danach wieder unbeschränkt nutzbar.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
      responses:
        "204":
          description: Zeitraum entfernt
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

