                  $ref: "#/components/schemas/VorlageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}:
    post:
      tags: [Vorlagen]
      operationId: createVorlage
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Vorlage anlegen
      description: |
        Legt eine neue Vorlage inkl. ihrer ersten Version `1.0` im Status `DRAFT` an.
        Die Kategorie muss existieren.

        | `typ` | `inhalt` | `schema` |
        |---|---|---|
        | `FORMULAR` | ODT | XSD (Pflicht) |
        | `BAUSTEIN` | ODT | – |
        | `MERKBLATT` | PDF | – |

        Bei Formularen werden die Baustein-Bereiche im ODT erkannt und Referenzen auf die jeweils
        höchste existierende Hauptversion angelegt (siehe `bausteine` in der Antwort).
      parameters:
        - $ref: "#/components/parameters/Kategorie"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VorlageCreateRequest"
            encoding:
              inhalt:
                contentType: application/vnd.oasis.opendocument.text, application/pdf
              schema:
                contentType: application/xml
      responses:
        "201":
          description: Vorlage mit Version `1.0` (`DRAFT`) angelegt
          headers:
            Location:
              $ref: "#/components/headers/LocationVorlage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VorlageResponse"
        "400":
          $ref: "#/components/responses/BadRequestBausteine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Kategorie nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestErrorInfo"
        "409":
          description: Vorlage mit diesem Namen existiert in der Kategorie bereits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestErrorInfo"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}:
    get:
      tags: [Vorlagen]
