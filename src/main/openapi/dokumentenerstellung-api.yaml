        Liefert alle Vorlagen, die den Filterkriterien entsprechen. Alle Kriterien sind optional und
        werden UND-verknüpft; mehrfach angegebene Werte eines Kriteriums werden ODER-verknüpft.
      parameters:
        - name: kategorie
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: typ
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VorlagenTyp"
        - name: tag
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: suchtext
          in: query
          required: false
          description: Teiltreffer in Name, Bezeichnung oder Beschreibung (ohne Groß-/Kleinschreibung)
          schema:
            type: string
            maxLength: 255
        - $ref: "#/components/parameters/StatusStichtag"
      responses:
        "200":
          description: Gefundene Vorlagen (ggf. leere Liste)
          content:
            application/json:
              schema:
                type: array
