  # ─────────────────────────── Verwaltung: Versionen ───────────────────────────
  /api/dokumentenerstellung/v1/vorlagen/{kategorie}/{vorlagenName}/versionen:
    get:
      tags: [Versionen]
      operationId: listVersionen
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Versionen einer Vorlage auflisten
      description: Liefert alle Versionen absteigend nach Versionsnummer.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
        - $ref: "#/components/parameters/StatusStichtag"
      responses:
        "200":
          description: Liste der Versionen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Versionen]
      operationId: createVersion
      security:
        - oidc: []
      x-rollen: [formular_verwaltung]
      summary: Neue Version anlegen
      description: |
        Legt eine neue Version im Status `DRAFT` an. Die Versionsnummer vergibt der Service:

        | `art` | Ergebnis |
        |---|---|
        | `HAUPT` | nächste Hauptversion `n.0` |
        | `NEBEN` | nächste Nebenversion der Hauptversion `basisHauptversion` (Standard: höchste) |

        Über `basisHauptversion` kann eine ältere Hauptversion korrigiert werden, z. B. `2.4`,
        obwohl bereits `3.0` existiert.

        **Kopie:** Inhalt, Schema und Baustein-Referenzen werden aus `basisVersion` übernommen
        (Standard: höchste Version der betroffenen Hauptversion bzw. höchste Version insgesamt bei `HAUPT`).
        Mitgeschickte Teile (`inhalt`, `schema`) ersetzen die übernommenen. So entsteht z. B. eine
        Nebenversion mit geänderter Baustein-Referenz ganz ohne Upload; die Referenzen werden danach
        über `PUT …/versionen/{version}/bausteine` angepasst.

        Bei Nebenversionen wird das Schema stets von der Hauptversion übernommen; ein mitgeschicktes
        Schema wird mit `400` abgelehnt.
      parameters:
        - $ref: "#/components/parameters/Kategorie"
        - $ref: "#/components/parameters/VorlagenName"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VersionCreateRequest"
            encoding:
              inhalt:
                contentType: application/vnd.oasis.opendocument.text, application/pdf
              schema:
                contentType: application/xml
      responses:
        "201":
          description: Version angelegt
          headers:
            Location:
              $ref: "#/components/headers/LocationVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequestBausteine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Vorlage, `basisHauptversion` oder `basisVersion` nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestErrorInfo"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

